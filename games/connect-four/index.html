<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connect Four</title>
  <meta name="theme-color" content="#10141f">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="../../css/players.css">
  <style>
    :root {
      --bg: #10141f;
      --text: #eef1f8;
      --text-dim: #9aa4bd;
      --panel: #1a2030;
      --frame: #243050;
      --hole: #0c1018;
      --gap: 3.2%;
      /* Vertical space the top bar and turn indicator need; the board sizes
         itself against what is left. Kept as a token so growing the turn
         text cannot quietly push the board off-screen. */
      --chrome: 11.5rem;
      color-scheme: dark;
    }
    @media (orientation: landscape) {
      :root { --chrome: 6rem; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(0.5rem + env(safe-area-inset-top)) 0.75rem 0.5rem;
      flex: none;
    }
    .topbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .topbar-actions { display: flex; gap: 0.5rem; }
    .chip {
      border: 1px solid #2b3450;
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .chip:disabled { opacity: 0.4; }

    /* Turn indicator — same shape in tic-tac-toe, which shows its X or O
       here instead of a disc. The piece names the player; the visually
       hidden label carries the sentence for screen readers. */
    .turn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4em;
      padding: 0 0.75rem 0.6rem;
      flex: none;
      /* The piece identifies the player, so the words are only the state and
         the line can run large. Portrait has the room above the board. */
      font-size: clamp(1.9rem, 9.5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }
    /* The visible line reads "<piece> to move"; the full sentence naming the
       player is kept for screen readers, which cannot see the color. */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    /* Landscape is short, not narrow: size against height so the board keeps
       the room it needs, and the status stays a fixed band. */
    @media (orientation: landscape) {
      .turn {
        font-size: clamp(1.05rem, 5vh, 1.7rem);
        padding-bottom: 0.4rem;
      }
    }
    .turn-disc {
      width: 1.15em;
      height: 1.15em;
      border-radius: 50%;
      flex: none;
      background: var(--player-1);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    }
    .turn[data-player="2"] .turn-disc { background: var(--player-2); }
    .turn[data-player="none"] .turn-disc { display: none; }
    /* Reads "Next: <piece>" while playing and "<piece> Wins!" once won, so
       the piece always sits where the sentence wants it. */
    .turn[data-state="playing"] .turn-text { order: -1; }
    .turn[data-state="over"] .turn-text { font-weight: 800; }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px calc(6px + env(safe-area-inset-bottom));
      min-height: 0;
    }
    /* The board keeps a 7:6 ratio and takes whichever of width/height runs
       out first, so it fills a phone in portrait and stays square-ish on a
       wide screen without ever scrolling. */
    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--gap);
      padding: var(--gap);
      background: var(--frame);
      border-radius: 16px;
      aspect-ratio: 7 / 6;
      width: 100%;
      max-width: min(100%, calc((100dvh - var(--chrome)) * 7 / 6));
      max-height: 100%;
    }
    /* Portrait: the board is smaller than the space below the top bar, and
       the leftover is split evenly above and below it by the ::after
       spacer. That centers the board and leaves the status centered in the
       gap above it, rather than parked against the top bar.

       This block must stay AFTER .stage and .board. A media query adds no
       specificity, so these overrides lose to the base rules on source
       order alone — which shows up as a squashed board, not as an error. */
    @media (orientation: portrait) {
      .turn { flex: 1; padding-top: 0.6rem; }
      .stage { flex: none; }
      body::after { content: ''; flex: 1; }
      /* The stage is content-sized here, so a percentage max-height on the
         board would depend on the board's own height. That cycle resolves
         to non-square cells; --chrome reserves the vertical space instead. */
      .board { max-height: none; }
    }
    .col {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: var(--gap);
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
      min-width: 0;
      border-radius: 8px;
    }
    .col:disabled { cursor: default; }
    /* The column, not the cell, is what clips a falling piece: the disc is
       positioned in its landing cell and animates up out of it, so cell-level
       clipping would hide the whole fall. Cells above the landing row are
       always empty, and the landing cell is a later sibling than all of
       them, so the piece paints over their holes on the way down. */
    .col { overflow: hidden; }
    /* Hover/press preview: the whole column lifts, which is the affordance
       that the column (not the cell) is the thing you touch. */
    .col:not(:disabled):active { background: rgba(255,255,255,0.10); }
    @media (hover: hover) {
      .col:not(:disabled):hover { background: rgba(255,255,255,0.06); }
    }

    .cell {
      background: var(--hole);
      border-radius: 50%;
      min-width: 0;
      min-height: 0;
      display: block;
      position: relative;
    }
    .disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: none;
      /* Lengths, not percentages — box-shadow rejects % and drops the whole
         declaration, which silently flattens every piece. */
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.35), inset 0 3px 5px rgba(255,255,255,0.16);
    }
    .cell[data-p="1"] .disc { display: block; background: var(--player-1); }
    .cell[data-p="2"] .disc { display: block; background: var(--player-2); }

    /* Falls from above the board: --r is how many cell-heights it travels,
       so a piece landing at the bottom falls further and takes longer. */
    .cell[data-drop] .disc {
      animation: drop var(--dur, 300ms) cubic-bezier(0.33, 0, 0.7, 1);
    }
    @keyframes drop {
      0%   { transform: translateY(calc(-1 * var(--r, 1) * (100% + var(--gap)))); }
      72%  { transform: translateY(0); }
      84%  { transform: translateY(-7%); }
      100% { transform: translateY(0); }
    }

    .cell[data-win] .disc {
      animation: pulse 900ms ease-in-out infinite;
      box-shadow: inset 0 0 0 3px var(--player-ink), inset 0 -3px 6px rgba(0,0,0,0.35);
    }
    @keyframes pulse {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.45); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cell[data-drop] .disc { animation: none; }
      .cell[data-win] .disc { animation: none; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../../">&larr; Games</a>
    <div class="topbar-actions">
      <button id="undo" class="chip" disabled>Undo</button>
      <button id="reset" class="chip">New game</button>
    </div>
  </div>

  <div id="turn" class="turn" data-player="1" data-state="playing" aria-live="polite">
    <span id="turn-disc" class="turn-disc" aria-hidden="true"></span>
    <span id="turn-text" class="turn-text" aria-hidden="true">Next:</span>
    <span id="turn-label" class="visually-hidden">Player 1 to move</span>
  </div>

  <main class="stage">
    <div id="board" class="board"></div>
  </main>

  <script src="../../js/lib/store.js"></script>
  <script src="connect-four.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(() => {});
    }
  </script>
</body>
</html>
