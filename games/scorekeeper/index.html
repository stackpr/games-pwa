<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scorekeeper</title>
  <meta name="theme-color" content="#10141f">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="../../css/players.css">
  <link rel="stylesheet" href="../../css/modal.css">
  <style>
    :root {
      /* js/lib/viewport.js measures the usable height and publishes it as
         --measured-height. Capping it at 100dvh means a measurement that
         is late or stale can only ever make the page shorter, never
         taller than the window. See CLAUDE.md. */
      --app-height: min(var(--measured-height, 100dvh), 100dvh);
      --bg: #10141f;
      --text: #eef1f8;
      --text-dim: #9aa4bd;
      --panel: #1a2030;
      --panel-hi: #2b3450;
      /* Seat colours. The first two alias the shared player identities so a
         two-player game looks exactly as it always has; the rest are local
         to this page. See Player colors in CLAUDE.md, and this game's notes. */
      --seat-1: var(--player-1);
      --seat-2: var(--player-2);
      --seat-3: #2f7d4f;
      --seat-4: #7a54c8;
      --seat-5: #b8791f;
      --seat-6: #23808f;
      --seat-7: #ac3f68;
      --seat-8: #55617f;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      padding: calc(0.5rem + env(safe-area-inset-top)) 0.75rem 0.5rem;
      flex: none;
    }
    .topbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .topbar-actions { display: flex; gap: 0.5rem; }
    .chip {
      border: 1px solid var(--panel-hi);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .chip:disabled { opacity: 0.4; }
    .chip.icon { padding: 0.35rem 0.7rem; font-size: 1.1rem; line-height: 1; }

    /* Seats tile into a grid; the column count is set from JS because
       repeat() will not take a min() of a custom property. */
    .board {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 0 6px calc(6px + env(safe-area-inset-bottom));
      min-height: 0;
    }
    .seat {
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      overflow: hidden;
      min-height: 0;
      min-width: 0;
      background: var(--seat-1);
    }
    .seat[data-seat="1"] { background: var(--seat-2); }
    .seat[data-seat="2"] { background: var(--seat-3); }
    .seat[data-seat="3"] { background: var(--seat-4); }
    .seat[data-seat="4"] { background: var(--seat-5); }
    .seat[data-seat="5"] { background: var(--seat-6); }
    .seat[data-seat="6"] { background: var(--seat-7); }
    .seat[data-seat="7"] { background: var(--seat-8); }

    .seat-name {
      width: 100%;
      border: none;
      background: rgba(0,0,0,0.18);
      color: var(--player-ink);
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      padding: 0.65rem 0.5rem;
      outline: none;
      /* A long name is truncated rather than wrapped or allowed to widen the
         seat: eight tiles on a phone have no room to negotiate. */
      min-width: 0;
      text-overflow: ellipsis;
    }
    .seat-name:focus { background: rgba(0,0,0,0.35); }

    /* One-line running history, newest on the right. Laying it out as a
       flex row justified to the end makes the overflow spill past the
       left edge, where it is clipped, so the latest entries stay visible. */
    .history {
      display: flex;
      justify-content: flex-end;
      overflow: hidden;
      padding: 0.3rem 0.5rem 0;
      min-height: 1.35rem;
    }
    .history-line {
      flex: none;
      white-space: nowrap;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.75);
      line-height: 1.05rem;
    }

    .tap-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--player-ink);
      min-height: 0;
      min-width: 0;
      touch-action: manipulation;
    }
    /* The number gets whatever height is left in a seat after the name,
       history and buttons — a fraction of the row height is not enough,
       because that fixed chrome does not shrink with the rows and the
       number ends up overlapping it. */
    .score {
      font-size: min(22vw, calc(((var(--app-height, 100dvh) - 4.5rem) / var(--rows, 1)
        - var(--seat-chrome, 9rem)) * 0.95));
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .tap-area:active .score { transform: scale(1.06); }
    .tap-hint {
      color: rgba(255,255,255,0.65);
      font-size: 0.8rem;
      text-align: center;
      padding-bottom: 0.35rem;
    }
    /* Once seats get short the hint is the first thing to go — it is a
       first-run affordance, and the number needs the height more. Set from
       JS, because "short" depends on the rows and the orientation together:
       two rows is roomy upright and cramped on a phone's side. */
    .board[data-compact] { --seat-chrome: 5.6rem; }
    .board[data-compact] .tap-hint { display: none; }
    .board[data-compact] .seat-name { font-size: 0.88rem; padding: 0.3rem 0.4rem; }
    .board[data-compact] .history { min-height: 1rem; padding-top: 0.1rem; }

    /* Two half-width targets sharing the strip along the bottom of a seat.
       The 2px gap is the seat colour showing through, which is what
       separates them — no border needed. */
    .adjust {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      flex: none;
    }
    .adjust-btn {
      border: none;
      background: rgba(0,0,0,0.22);
      color: var(--player-ink);
      font-size: 1.6rem;
      font-weight: 700;
      /* Taller than the single -1 strip it replaced: each half is now half
         as wide, so it needs the height back to stay thumb-sized. */
      padding: 1.15rem 0.55rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .board[data-compact] .adjust-btn { font-size: 1.15rem; padding: 0.6rem 0.4rem; }
    .adjust-btn:active { background: rgba(0,0,0,0.4); }

    .count-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.35rem;
    }
    .count {
      background: var(--bg);
      border: 1px solid var(--panel-hi);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.5rem 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .count[aria-pressed="true"] { background: var(--panel-hi); }
    .settings-note {
      margin: 0.7rem 0 0;
      font-size: 0.78rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../../">&larr; Games</a>
    <div class="topbar-actions">
      <button id="settings-btn" class="chip icon" type="button"
              aria-label="Settings: number of players" aria-expanded="false">&#10043;</button>
      <button id="undo" class="chip" type="button" disabled>Undo</button>
      <button id="reset" class="chip" type="button">Reset</button>
    </div>
  </div>

  <main class="board" id="board" data-rows="1"></main>

  <div class="modal" id="settings">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 class="modal-title" id="settings-title">Number of players</h2>
      <div class="count-row" id="count-row"></div>
      <p class="settings-note">
        Two a row upright, four across in landscape. Removing a player drops
        their score.
      </p>
      <button class="modal-close" type="button" data-close>Close</button>
    </div>
  </div>

  <script src="../../js/lib/viewport.js"></script>
  <script src="../../js/lib/store.js"></script>
  <script src="../../js/lib/modal.js"></script>
  <script src="scorekeeper.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(() => {});
    }
  </script>
</body>
</html>
