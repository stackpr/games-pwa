<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tic-Tac-Toe</title>
  <meta name="theme-color" content="#10141f">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="../../css/players.css">
  <style>
    :root {
      --bg: #10141f;
      --text: #eef1f8;
      --text-dim: #9aa4bd;
      --panel: #1a2030;
      --frame: #243050;
      --hole: #0c1018;
      --gap: 3.2%;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(0.5rem + env(safe-area-inset-top)) 0.75rem 0.5rem;
      flex: none;
    }
    .topbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .topbar-actions { display: flex; gap: 0.5rem; }
    .chip {
      border: 1px solid #2b3450;
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .chip:disabled { opacity: 0.4; }

    /* Turn indicator — identical markup and behaviour in connect-four. */
    .turn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0 0.75rem 0.55rem;
      flex: none;
      font-size: 1.05rem;
      font-weight: 600;
      min-height: 2rem;
    }
    .turn-disc {
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 50%;
      flex: none;
      background: var(--player-1);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    }
    .turn[data-player="2"] .turn-disc { background: var(--player-2); }
    .turn[data-player="none"] .turn-disc { display: none; }
    .turn[data-state="over"] .turn-text { font-weight: 800; }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px calc(6px + env(safe-area-inset-bottom));
      min-height: 0;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--gap);
      padding: var(--gap);
      background: var(--frame);
      border-radius: 16px;
      aspect-ratio: 1;
      width: 100%;
      max-width: min(100%, 100dvh - 11rem, 30rem);
      max-height: 100%;
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--hole);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
      min-width: 0;
      min-height: 0;
      padding: 0;
    }
    .cell:disabled { cursor: default; }
    .cell:not(:disabled):active { background: #161c2b; }
    @media (hover: hover) {
      .cell:not(:disabled):hover { background: #141a28; }
    }
    .cell[data-win] {
      background: #1d2740;
      animation: pulse 900ms ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.5); }
    }

    .mark {
      width: 62%;
      height: 62%;
      fill: none;
      stroke-width: 11;
      stroke-linecap: round;
      overflow: visible;
    }
    .mark-x { stroke: var(--player-1); }
    .mark-o { stroke: var(--player-2); }

    /* Only the freshly played mark draws itself in; marks restored from a
       saved game are simply present. */
    .cell[data-new] .mark-x line {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: draw 200ms ease-out forwards;
    }
    .cell[data-new] .mark-x line:last-child { animation-delay: 130ms; }
    .cell[data-new] .mark-o circle {
      stroke-dasharray: 183;
      stroke-dashoffset: 183;
      animation: draw 300ms ease-out forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cell[data-win] { animation: none; }
      .cell[data-new] .mark-x line,
      .cell[data-new] .mark-o circle { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../../">&larr; Games</a>
    <div class="topbar-actions">
      <button id="undo" class="chip" disabled>Undo</button>
      <button id="reset" class="chip">New game</button>
    </div>
  </div>

  <div id="turn" class="turn" data-player="1" aria-live="polite">
    <span id="turn-disc" class="turn-disc"></span>
    <span id="turn-text" class="turn-text">Player 1 (X) to move</span>
  </div>

  <main class="stage">
    <div id="board" class="board"></div>
  </main>

  <script src="tic-tac-toe.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(() => {});
    }
  </script>
</body>
</html>
