<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tic-Tac-Toe</title>
  <meta name="theme-color" content="#10141f">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="../../css/players.css">
  <style>
    :root {
      /* js/lib/viewport.js measures the usable height and publishes it as
         --measured-height. Capping it at 100dvh means a measurement that
         is late or stale can only ever make the page shorter, never
         taller than the window. See CLAUDE.md. */
      --app-height: min(var(--measured-height, 100dvh), 100dvh);
      --bg: #10141f;
      --text: #eef1f8;
      --text-dim: #9aa4bd;
      --panel: #1a2030;
      --frame: #243050;
      --hole: #0c1018;
      --gap: 3.2%;
      /* Vertical space the top bar and turn indicator need; the board sizes
         itself against what is left. Kept as a token so growing the turn
         text cannot quietly push the board off-screen. */
      --chrome: 11.5rem;
      color-scheme: dark;
    }
    @media (orientation: landscape) {
      :root { --chrome: 6rem; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(0.5rem + env(safe-area-inset-top)) 0.75rem 0.5rem;
      flex: none;
    }
    .topbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .topbar-actions { display: flex; gap: 0.5rem; }
    .chip {
      border: 1px solid #2b3450;
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .chip:disabled { opacity: 0.4; }

    /* Turn indicator — identical markup and behaviour in four-in-a-row. */
    .turn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4em;
      padding: 0 0.75rem 0.6rem;
      flex: none;
      /* The mark identifies the player, so the words are only the state and
         the line can run large. Portrait has the room above the board. */
      font-size: clamp(1.9rem, 9.5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }
    /* The visible line reads "Next: X"; the full sentence naming the player
       is kept for screen readers. */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    /* Landscape is short, not narrow: size against height so the board keeps
       the room it needs, and the status stays a fixed band. */
    @media (orientation: landscape) {
      .turn {
        font-size: clamp(1.05rem, 5vh, 1.7rem);
        padding-bottom: 0.4rem;
      }
    }
    /* Where four-in-a-row shows a plain colored disc, this shows the mark the
       player is about to place — so the indicator carries shape as well as
       color, and the label stays as short as four-in-a-row's. */
    .turn-disc {
      width: 1.15em;
      height: 1.15em;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .turn-disc .mark { width: 100%; height: 100%; stroke-width: 14; }
    .turn[data-player="none"] .turn-disc { display: none; }
    /* Reads "Next: X" while playing and "X Wins!" once won, so the mark
       always sits where the sentence wants it. */
    .turn[data-state="playing"] .turn-text { order: -1; }
    .turn[data-state="over"] .turn-text { font-weight: 800; }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px calc(6px + env(safe-area-inset-bottom));
      min-height: 0;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: var(--gap);
      padding: var(--gap);
      background: var(--frame);
      border-radius: 16px;
      aspect-ratio: 1;
      width: 100%;
      max-width: min(100%, calc(var(--app-height, 100dvh) - var(--chrome)), 30rem);
      max-height: 100%;
    }
    /* Portrait: the board is smaller than the space below the top bar, and
       the leftover is split evenly above and below it by the ::after
       spacer. That centers the board and leaves the status centered in the
       gap above it, rather than parked against the top bar.

       This block must stay AFTER .stage and .board. A media query adds no
       specificity, so these overrides lose to the base rules on source
       order alone — which shows up as a squashed board, not as an error. */
    @media (orientation: portrait) {
      .turn { flex: 1; padding-top: 0.6rem; }
      .stage { flex: none; }
      body::after { content: ''; flex: 1; }
      /* The stage is content-sized here, so a percentage max-height on the
         board would depend on the board's own height. That cycle resolves
         to non-square cells; --chrome reserves the vertical space instead. */
      .board { max-height: none; }
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--hole);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
      min-width: 0;
      min-height: 0;
      padding: 0;
    }
    .cell:disabled { cursor: default; }
    .cell:not(:disabled):active { background: #161c2b; }
    @media (hover: hover) {
      .cell:not(:disabled):hover { background: #141a28; }
    }
    /* Winning line: ringed in --player-ink and pulsing, the same treatment
       four-in-a-row gives its four discs. The ring is what carries the
       highlight when the pulse is at its dimmest and when motion is off,
       so it must never be the animation alone. Lengths in px — box-shadow
       voids the whole declaration if it sees a percentage. */
    .cell[data-win] {
      background: #1d2740;
      box-shadow: inset 0 0 0 3px var(--player-ink);
      animation: pulse 900ms ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.5); }
    }

    .mark {
      width: 62%;
      height: 62%;
      fill: none;
      stroke-width: 11;
      stroke-linecap: round;
      overflow: visible;
    }
    .mark-x { stroke: var(--player-1); }
    .mark-o { stroke: var(--player-2); }

    /* Only the freshly played mark draws itself in; marks restored from a
       saved game are simply present. */
    .cell[data-new] .mark-x line {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: draw 200ms ease-out forwards;
    }
    .cell[data-new] .mark-x line:last-child { animation-delay: 130ms; }
    .cell[data-new] .mark-o circle {
      stroke-dasharray: 183;
      stroke-dashoffset: 183;
      animation: draw 300ms ease-out forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cell[data-win] { animation: none; }
      .cell[data-new] .mark-x line,
      .cell[data-new] .mark-o circle { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../../">&larr; Games</a>
    <div class="topbar-actions">
      <button id="undo" class="chip" disabled>Undo</button>
      <button id="reset" class="chip">New game</button>
    </div>
  </div>

  <div id="turn" class="turn" data-player="1" data-state="playing" aria-live="polite">
    <span id="turn-disc" class="turn-disc" aria-hidden="true"></span>
    <span id="turn-text" class="turn-text" aria-hidden="true">Next:</span>
    <span id="turn-label" class="visually-hidden">Player 1 (X) to move</span>
  </div>

  <main class="stage">
    <div id="board" class="board"></div>
  </main>

  <script src="../../js/lib/viewport.js"></script>
  <script src="../../js/lib/store.js"></script>
  <script src="tic-tac-toe.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(() => {});
    }
  </script>
</body>
</html>
