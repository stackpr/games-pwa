<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Golf</title>
  <meta name="theme-color" content="#10141f">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="../../css/modal.css">
  <style>
    :root {
      /* js/lib/viewport.js measures the usable height and publishes it as
         --measured-height. Capping at 100dvh means a late or stale
         measurement can only make the page shorter. See CLAUDE.md. */
      --app-height: min(var(--measured-height, 100dvh), 100dvh);
      --bg: #10141f;
      --text: #eef1f8;
      --text-dim: #9aa4bd;
      --panel: #1a2030;
      --panel-hi: #2b3450;
      --line: #232c44;
      /* Semantic, not player identities: the seat count is open-ended, so
         these name a state rather than a person. See CLAUDE.md. */
      --under: #4cc08a;
      --over: #e0705d;
      --lead: #e8ab52;
      --empty: #151b2a;
      --hole-w: 2.6rem;
      --par-w: 2.4rem;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: calc(0.45rem + env(safe-area-inset-top)) 0.75rem 0.45rem;
      flex: none;
    }
    .topbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .topbar-right { display: flex; gap: 0.4rem; }
    .chip {
      border: 1px solid var(--panel-hi);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .chip.round { padding: 0.35rem 0.62rem; }
    .chip[data-armed] { background: var(--over); border-color: var(--over); color: #fff; }

    /* The card is the only thing that scrolls, in both directions: down
       through the holes and sideways through the players. */
    .card-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 0.5rem calc(0.5rem + env(safe-area-inset-bottom));
    }
    table.card {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
    }
    table.card th, table.card td {
      padding: 0;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    /* The hole and par columns stay put while the players scroll past, so a
       row is never a number with nothing to attach it to. */
    .col-hole, .col-par {
      position: sticky;
      z-index: 2;
      background: var(--bg);
    }
    .col-hole { left: 0; width: var(--hole-w); min-width: var(--hole-w); }
    .col-par {
      left: var(--hole-w);
      width: var(--par-w);
      min-width: var(--par-w);
      color: var(--text-dim);
      font-size: 0.82rem;
    }
    body:not([data-par]) .col-par { display: none; }
    /* One player's column against the next. The score squares read as
       separate because of their own margin, but the names, the subtotals
       and the totals are bare text — at eight players on a 320px screen
       they run into each other without this. */
    .col-p { border-left: 1px solid var(--line); }
    thead th.col-p { border-left-color: var(--panel-hi); }

    thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 0.3rem 0.15rem 0.4rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 700;
      border-bottom: 1px solid var(--panel-hi);
    }
    thead th.col-hole, thead th.col-par { z-index: 4; }
    .player-name {
      display: block;
      max-width: 5.5rem;
      margin: 0 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .player-sub { display: block; font-size: 0.7rem; color: var(--text-dim); font-weight: 600; }

    td.score-cell { min-width: 3rem; }
    .score {
      width: 100%;
      min-height: 2.5rem;
      border: none;
      background: var(--empty);
      color: var(--text);
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      border-radius: 8px;
      margin: 2px 2px;
      cursor: pointer;
      touch-action: manipulation;
      /* Lengths, never percentages — one percentage voids the whole
         declaration and the ring silently disappears. */
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .score:active { filter: brightness(1.4); }
    .score[data-set] { background: var(--panel); }
    /* Under and over par carry a shape as well as a colour: the ring is on
       the low side and absent on the high side, so the two never rely on
       hue alone. */
    .score[data-vs="under"] { box-shadow: inset 0 0 0 2px var(--under); color: var(--under); }
    .score[data-vs="over"] { color: var(--over); }
    .score[data-vs="ace"] { box-shadow: inset 0 0 0 2px var(--lead); color: var(--lead); }

    tr.sub td, tr.sub th { background: #161c2b; font-size: 0.9rem; }
    tr.sub .col-hole, tr.sub .col-par { background: #161c2b; }
    tr.sub td { color: var(--text); padding: 0.35rem 0.1rem; }
    .sub-label { font-size: 0.75rem; letter-spacing: 0.06em; color: var(--text-dim); }

    tfoot th, tfoot td {
      position: sticky;
      bottom: 0;
      z-index: 3;
      background: #1c2436;
      padding: 0.45rem 0.1rem;
      font-size: 1.05rem;
      border-top: 1px solid var(--panel-hi);
      border-bottom: none;
    }
    tfoot .col-hole, tfoot .col-par { z-index: 4; background: #1c2436; }
    .grand-total { display: block; font-weight: 800; }
    .grand-vs { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-dim); }
    .grand-vs[data-vs="under"] { color: var(--under); }
    .grand-vs[data-vs="over"] { color: var(--over); }
    /* The leader is marked with a ring and weight rather than a colour of
       its own, because there is no fixed number of seats to colour. */
    tfoot td[data-lead] .grand-total { color: var(--lead); }
    tfoot td[data-lead] { box-shadow: inset 0 0 0 2px var(--lead); border-radius: 8px; }

    /* --- the stroke picker --- */
    /* Par is picked from inside the settings sheet, so the pad has to stack
       above it. Both modals are z-index 20 from css/modal.css and settings
       comes later in the DOM, which would otherwise put the pad behind the
       sheet that opened it — reachable by neither tap nor eye. */
    #picker { z-index: 30; }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .pad button {
      aspect-ratio: 1;
      border: 1px solid var(--panel-hi);
      background: var(--bg);
      color: var(--text);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1.6rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    .pad button:active { background: var(--panel-hi); }
    .pad button[data-par-mark]::after {
      content: 'par';
      display: block;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-dim);
      margin-top: -0.35rem;
    }
    .pad-clear {
      width: 100%;
      margin-top: 0.6rem;
      border: 1px solid var(--panel-hi);
      background: var(--bg);
      color: var(--text-dim);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.55rem 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* --- settings --- */
    .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 0.9rem; }
    .field-label { font-size: 0.8rem; font-weight: 700; color: var(--text-dim); }
    .pick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
    .pick, .count {
      border: 1px solid var(--panel-hi);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.5rem 0.2rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .pick[aria-pressed="true"], .count[aria-pressed="true"] {
      background: var(--panel-hi);
      font-weight: 700;
    }
    .count-row { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .count { min-width: 2.4rem; flex: none; }

    /* Same shape as the party games' name panel, and the same list behind
       it; the game's notes say why the markup is not shared. */
    body[data-name-mode="type"] .recent-wrap { display: none; }
    body[data-name-mode="pick"] .name-inputs { display: none; }
    .name-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem; }
    .name-input {
      min-width: 0;
      border: 1px solid var(--panel-hi);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      padding: 0.45rem 0.55rem;
      text-overflow: ellipsis;
    }
    .name-input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--lead); }
    .recent-wrap { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .recent {
      background: var(--panel);
      border: 1px solid var(--panel-hi);
      border-radius: 999px;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      touch-action: manipulation;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .recent[aria-pressed="true"] {
      color: var(--text);
      background: var(--panel-hi);
      box-shadow: inset 0 0 0 2px var(--lead);
    }
    .recent-empty { margin: 0; font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; }

    .par-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.3rem; }
    .par-hole {
      border: 1px solid var(--panel-hi);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.35rem 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .par-hole small { display: block; font-size: 0.62rem; font-weight: 600; color: var(--text-dim); }
    .par-hole .par-val { display: block; }
    .par-hole[data-unset] { color: var(--text-dim); }
    .setting-note { margin: 0.35rem 0 0; font-size: 0.78rem; color: var(--text-dim); line-height: 1.4; }
    .ghost {
      border: 1px solid var(--panel-hi);
      background: transparent;
      color: var(--text-dim);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
      touch-action: manipulation;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    @media (max-height: 460px) {
      .modal-panel { padding: 0.7rem 0.8rem; }
      .field { margin-bottom: 0.6rem; }
    }
  </style>
</head>
<body data-name-mode="type">
  <div class="topbar">
    <a href="../../">&larr; Games</a>
    <div class="topbar-right">
      <button id="settings-btn" class="chip round" type="button"
              aria-label="Settings" aria-expanded="false">&#9881;</button>
      <button id="new-btn" class="chip" type="button">New round</button>
    </div>
  </div>

  <div class="card-wrap">
    <table class="card" id="card"></table>
  </div>

  <p id="say" class="visually-hidden" aria-live="polite"></p>

  <div class="modal" id="picker">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <h2 class="modal-title" id="picker-title">Strokes</h2>
      <div class="pad" id="pad"></div>
      <button class="pad-clear" id="pad-clear" type="button">Clear</button>
      <button class="modal-close" type="button" data-close>Cancel</button>
    </div>
  </div>

  <div class="modal" id="settings">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 class="modal-title" id="settings-title">Settings</h2>

      <div class="field">
        <span class="field-label" id="label-holes">Holes</span>
        <div class="pick-row" id="holes-row" role="group" aria-labelledby="label-holes">
          <button class="pick" type="button" data-holes="9">9 holes</button>
          <button class="pick" type="button" data-holes="18">18 holes</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label" id="label-players">Players</span>
        <div class="count-row" id="count-row" role="group" aria-labelledby="label-players"></div>
      </div>

      <div class="field">
        <span class="field-label">Names</span>
        <div class="pick-row" id="name-mode-row" role="group" aria-label="How to set names">
          <button class="pick" type="button" data-name-mode="pick">Pick who's here</button>
          <button class="pick" type="button" data-name-mode="type">Type them</button>
        </div>
        <div class="name-inputs" id="name-inputs"></div>
        <div class="recent-wrap" id="recent-list"></div>
      </div>

      <div class="field">
        <span class="field-label" id="label-par">Par</span>
        <div class="pick-row" id="par-row" role="group" aria-labelledby="label-par">
          <button class="pick" type="button" data-par="off">No par</button>
          <button class="pick" type="button" data-par="on">Track par</button>
        </div>
        <div id="par-editor" hidden>
          <div class="par-grid" id="par-grid"></div>
          <p class="setting-note">Tap a hole to set its par. Handy for mini
            golf, where every hole is usually the same:</p>
          <button class="ghost" id="par-all" type="button">Set every hole at once</button>
        </div>
      </div>

      <button class="modal-close" type="button" data-close>Close</button>
    </div>
  </div>

  <script src="../../js/lib/viewport.js"></script>
  <script src="../../js/lib/store.js"></script>
  <script src="../../js/lib/names.js"></script>
  <script src="../../js/lib/modal.js"></script>
  <script src="golf.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(() => {});
    }
  </script>
</body>
</html>
