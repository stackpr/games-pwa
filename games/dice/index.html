<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice</title>
  <meta name="theme-color" content="#10141f">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="../../css/dice.css">
  <style>
    :root {
      /* js/lib/viewport.js measures the usable height and publishes it as
         --measured-height. Capping it at 100dvh means a measurement that
         is late or stale can only ever make the page shorter, never
         taller than the window. See CLAUDE.md. */
      --app-height: min(var(--measured-height, 100dvh), 100dvh);
      --bg: #10141f;
      --text: #eef1f8;
      --text-dim: #9aa4bd;
      --panel: #1a2030;
      --panel-hi: #2b3450;
      --tray: #171d2c;
      --die: #eef1f8;
      --die-ink: #10141f;
      --chrome: 13rem;
      color-scheme: dark;
    }
    @media (orientation: landscape) {
      :root { --chrome: 11rem; }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(0.4rem + env(safe-area-inset-top)) 0.75rem 0.4rem;
      flex: none;
    }
    .topbar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .topbar-label {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* How many dice — the only setting, so it stays on screen rather than
       hiding behind a button the way 10,000's player count does. */
    .count-row {
      display: flex;
      gap: 0.35rem;
      padding: 0 0.5rem 0.5rem;
      flex: none;
    }
    .count {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--panel-hi);
      border-radius: 10px;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 700;
      padding: 0.5rem 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .count[aria-pressed="true"] {
      background: var(--panel-hi);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.55);
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 0.5rem;
      min-height: 0;
    }
    /* Square, positioning and pips come from css/dice.css; this is only the
       tray's size and skin. The whole tray is a roll target. */
    .tray {
      width: 100%;
      max-width: min(100%, calc(var(--app-height, 100dvh) - var(--chrome)), 26rem);
      background: var(--tray);
      border: 1px solid var(--panel-hi);
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .controls {
      flex: none;
      display: flex;
      padding: 0.6rem 0.5rem calc(0.5rem + env(safe-area-inset-bottom));
    }
    .action {
      flex: 1;
      border: none;
      border-radius: 14px;
      background: #2f6f5a;
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 700;
      padding: 0.8rem 0.5rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .action:disabled { opacity: 0.45; cursor: default; }
    .action:not(:disabled):active { filter: brightness(1.25); }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="../../">&larr; Games</a>
    <span class="topbar-label">How many dice?</span>
  </div>

  <div class="count-row" id="count-row" role="group" aria-label="Number of dice"></div>

  <main class="stage">
    <div class="tray dice-tray" id="tray"></div>
  </main>

  <div class="controls">
    <button id="roll" class="action" type="button">Roll!</button>
  </div>

  <p id="result" class="visually-hidden" aria-live="polite"></p>

  <script src="../../js/lib/viewport.js"></script>
  <script src="../../js/lib/store.js"></script>
  <script src="../../js/lib/dice.js"></script>
  <script src="dice.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(() => {});
    }
  </script>
</body>
</html>
